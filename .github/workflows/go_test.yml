name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Go setup
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - run: go version

      - name: Run tests
        run: make ci
